name: Update Profile Graphs

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */4 * * *" # every 4 hours so "Today" stays fresh
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-graphs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Generate summary cards (stats, languages, contributions, productive time)
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 5.5

      - name: Sync with the commit made by the summary-cards step
        run: git pull --rebase origin main

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Generate daily contributions graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 scripts/daily_graph.py

      - name: Commit and push generated files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --staged --quiet || git commit -m "chore: update profile graphs"
          git pull --rebase origin main
          git push
